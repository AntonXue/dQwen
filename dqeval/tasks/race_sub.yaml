# RACE-high on a SEEDED 1000-doc sample of the 1,045-doc test split.
#
# Near-full (96%), so this is not really about cost -- it is about ORDERING. RACE is
# grouped by article, so a truncated slice over-weights whichever articles come first.
# Sampling with the pinned seed (utils.SUBSAMPLE_SEED) removes that, and keeps the
# subset byte-identical across models and reruns.
#
# doc_to_* are IMPORTED from lm_eval's own `preprocess_race` via utils.py re-exports
# rather than copied, so upstream preprocessing cannot drift away from ours.
task: race_sub
dataset_path: EleutherAI/race
dataset_name: high
output_type: multiple_choice
test_split: test
process_docs: !function utils.race_sub_process_docs
doc_to_text: !function utils.race_doc_to_text
doc_to_target: !function utils.race_doc_to_target
doc_to_choice: !function utils.race_doc_to_choice
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
metadata:
  version: 2.0
