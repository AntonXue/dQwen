[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dqeval"
version = "0.1.0"
description = "Reproducible evaluation for diffusion language models: dQwen, LLaDA, Dream, SDAR"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["dqeval*"]
