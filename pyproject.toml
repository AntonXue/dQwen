# =============================================================================
# What this file is for -- and, more importantly, what it is NOT for.
#
# IT IS FOR: making `import dqeval` work without PYTHONPATH juggling, via
#
#     cd ~/foo/dQwen && pip install -e .
#
#   into the already-built `qwen35` conda environment. That matters for SLURM
#   job scripts, pytest, and running tests/load_matrix.py from any directory.
#
# IT IS *NOT* FOR: creating the environment. That is impossible here and always
#   will be. flash_attn, tilelang, flash-linear-attention and torch+cu128 all
#   need compilation against a specific CUDA toolkit, so the environment is a
#   hand-built conda env, not something pip can resolve.
#
#   => `envs/requirements-eval.txt` is the SOURCE OF TRUTH for what to install.
#      `dependencies` below is deliberately EMPTY so this file cannot drift into
#      a second, half-true dependency list. If you came here looking for the
#      dependency set, you want envs/requirements-eval.txt instead.
#
# GOTCHA: do NOT `pip install -e .` from inside a git worktree (e.g.
#   .claude/worktrees/*). Editable installs record an ABSOLUTE path; when the
#   worktree is cleaned up you are left with a dangling entry in site-packages
#   that silently shadows the real package. Always install from the repo root.
#
# Note on reproducibility: torch is pinned EXACTLY in envs/requirements-eval.txt
# rather than loosely, because the transformers-5.13 port of LLaDA/Dream/SDAR is
# bitwise-exact only at fixed torch -- 100% of the numerical drift we measured
# came from torch 2.5.1 -> 2.7.1 and 0% from transformers. torch version is part
# of the reproducibility contract, not an incidental dependency.
# =============================================================================

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dqeval"
version = "0.1.0"
description = "Reproducible evaluation for diffusion language models: dQwen, LLaDA, Dream, SDAR"
requires-python = ">=3.10"
dependencies = []   # intentional -- see the header. Use envs/requirements-eval.txt.

# When the CLI lands (Phase 3), its entry point goes here, e.g.
#   [project.scripts]
#   dqeval = "dqeval.cli:main"

[tool.setuptools.packages.find]
include = ["dqeval*"]
